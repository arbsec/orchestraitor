pre-commit:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --check
      glob: "*.rs"
      stage_fixed: false
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      glob: "*.rs"
      stage_fixed: false
    # Local half of the rumdl pin assertion (arbsec/orchestraitor#774). The CI
    # job (.github/workflows/markdown.yml) refuses to lint with an unpinned
    # rumdl; without the same guard here a `rumdl` first on a developer's PATH
    # (e.g. a cargo install shadowing the mise shim) hands the pre-commit hook a
    # different rule set than CI. Measured on this repository: 0.2.20's stale
    # slugger reported two MD051 false positives in a tree 0.3.2 calls clean.
    # Fail closed — a hook that lints with rules CI will not reproduce is worse
    # than a hook that stops and says how to fix it.
    markdown-lint:
      run: |
        pinned="$(sed -n 's/^rumdl = "\(.*\)"$/\1/p' .mise.toml)"
        if [ -z "$pinned" ]; then
          echo "error: no rumdl pin in .mise.toml — the markdown gate needs one" >&2
          exit 1
        fi
        installed="$(rumdl --version 2>/dev/null | sed -n 's/^rumdl //p')"
        if [ "$installed" != "$pinned" ]; then
          echo "error: rumdl ${installed:-<not found>} is not the pinned $pinned (.mise.toml)" >&2
          echo "  fix: make the pinned rumdl first on PATH ('mise install'); a cargo or distro rumdl shadows it" >&2
          exit 1
        fi
        rumdl check {staged_files}
      glob: "*.{md,markdown}"
      stage_fixed: false
    # Pre-landing simplify pass (fail-open quality tooling; spec §9.5): a
    # fast-feedback affordance only — hooks are bypassable, and the real
    # gate is the push path (the review-loop PR's pre-push gate). The pass
    # never blocks: it exits 0 (config-resolution failures included; they
    # surface as an ORC-SIMPLIFY-001 warning and skip). No `--fix` here:
    # `--staged` runs are check-only by design — format fixes would rewrite
    # whole files and clobber unstaged hunks.
    simplify:
      run: orc simplify run --staged
      glob: "*.rs"
      stage_fixed: false

commit-msg:
  commands:
    cocogitto:
      run: cog verify --file {1}

pre-push:
  commands:
    test:
      run: cargo nextest run --no-tests=pass
      glob:
        - "*.rs"
        - "**/*.rs"
    # Fast-feedback simplify check above Format class: exits 1 only when
    # unaddressed safe-fix/semantic suggestions exist. Deliberately NOT
    # `--staged`: at pre-push time the branch is fully committed, the index
    # matches HEAD, and a staged scope would be empty — the check would see
    # only pathless findings. Unscoped, it reviews the whole tree. A non-
    # zero exit DOES reject a local `git push` — hooks are bypassable and
    # untrusted-adjacent, so this is fast feedback, never the AUTHORITATIVE
    # pre-landing gate (that is the review-loop PR's push-branch gate, and
    # developers can override with --no-verify).
    simplify-push:
      run: orc simplify run --pedantic-check
      glob:
        - "*.rs"
        - "**/*.rs"
    # Verified-commit gate (AGENTS.md service-identity rule; see
    # .agents/skills/github-pr-lifecycle/references/verified-commit-path.md):
    # agent commits MUST be created via the App API (createCommitOnBranch) so
    # GitHub signs them. A locally-created commit carrying the bot identity is
    # unsigned by construction — block the push instead of replaying after the
    # fact. Human-authored commits are exempt (their own key signs them).
    verified-commits:
      # Invoked through `bash` rather than direct-executed: the skill scripts are
      # kept at mode 100644 (the RAW createCommitOnBranch FileChanges payload has
      # no mode field — PR #487; #556 lets `orc github push-branch` land 100755
      # through the REST tree + commit transport, but the scripts stay
      # non-executable by choice, #709), so a direct invocation fails with exit 126
      # (Permission denied) and the gate silently never runs. Running it
      # under bash makes the gate independent of the committed mode.
      run: bash .agents/skills/github-pr-lifecycle/scripts/check-unsigned-bot-commits
      use_stdin: true
