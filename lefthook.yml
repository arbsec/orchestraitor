pre-commit:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --check
      glob: "*.rs"
      stage_fixed: false
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      glob: "*.rs"
      stage_fixed: false
    markdown-lint:
      run: rumdl check {staged_files}
      glob: "*.{md,markdown}"
      stage_fixed: false

commit-msg:
  commands:
    cocogitto:
      run: cog verify --file {1}

pre-push:
  commands:
    test:
      run: cargo nextest run --no-tests=pass
      glob:
        - "*.rs"
        - "**/*.rs"
    # Verified-commit gate (AGENTS.md service-identity rule; see
    # .agents/skills/github-pr-lifecycle/references/verified-commit-path.md):
    # agent commits MUST be created via the App API (createCommitOnBranch) so
    # GitHub signs them. A locally-created commit carrying the bot identity is
    # unsigned by construction — block the push instead of replaying after the
    # fact. Human-authored commits are exempt (their own key signs them).
    verified-commits:
      # Invoked through `bash` rather than direct-executed: the script was
      # committed 100644 (createCommitOnBranch forces FileAddition mode
      # 100644 — see PR #487), so a direct invocation fails with exit 126
      # (Permission denied) and the gate silently never runs. Running it
      # under bash makes the gate independent of the committed mode.
      run: bash .agents/skills/github-pr-lifecycle/scripts/check-unsigned-bot-commits
      use_stdin: true
