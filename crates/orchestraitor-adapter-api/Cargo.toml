[package]
name = "orchestraitor-adapter-api"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Agent adapter trait and provider-neutral session API for Orchestraitor"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
orchestraitor-events = { path = "../orchestraitor-events" }
orchestraitor-model = { path = "../orchestraitor-model" }
orchestraitor-provider-api = { path = "../orchestraitor-provider-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
tokio = { workspace = true }
