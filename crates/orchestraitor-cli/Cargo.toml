[package]
name = "orchestraitor-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command-line interface for Orchestraitor"

[[bin]]
name = "orc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# async-trait (MIT OR Apache-2.0): object-safe impls of the campaign loop's
# BoardPoller/LoopWorkerStarter seams; matches the board/provider crates.
async-trait = "0.1"
# base64 (MIT OR Apache-2.0): FileAddition.contents encoding for the
# `orc github push-branch` App-signed landing path (already in the lock via
# reqwest/hyper-util; no new package).
base64 = "0.23.0"
# uuid (MIT OR Apache-2.0): invocation-unique temporary landing branch names
# for `orc github push-branch` (already in the workspace tree).
uuid = { workspace = true }
clap = { workspace = true }
miette = { workspace = true }
# orchestraitor-mcp (MIT OR Apache-2.0): the board.query decision tool
# (spec §9.39, issue #332) surfaced as `orc board query`.
orchestraitor-mcp = { path = "../orchestraitor-mcp" }
# orchestraitor-events (MIT OR Apache-2.0): the §9.25.1 audit store the
# board.query CLI invocation records into.
orchestraitor-events = { path = "../orchestraitor-events" }
# orchestraitor-board-contract (MIT OR Apache-2.0): the fixture BoardProvider
# `orc board query` reads through in this slice (sqlite provider is #318
# follow-up).
orchestraitor-board-contract = { path = "../orchestraitor-board-contract" }
orchestraitor-agent-catalog = { path = "../orchestraitor-agent-catalog" }
orchestraitor-board = { path = "../orchestraitor-board" }
orchestraitor-campaign = { path = "../orchestraitor-campaign" }
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-cost-ledger = { path = "../orchestraitor-cost-ledger" }
orchestraitor-model = { path = "../orchestraitor-model" }
# orchestraitor-simplify (MIT OR Apache-2.0): the rule-driven pre-landing
# simplify pass surfaced as `orc simplify run`.
orchestraitor-simplify = { path = "../orchestraitor-simplify" }
# orchestraitor-provider-api (MIT OR Apache-2.0): the §9.45 DecisionProvider
# trait object the `routing.provider` flag builds for task selection.
orchestraitor-provider-api = { path = "../orchestraitor-provider-api" }
orchestraitor-provider-neuralwatt = { path = "../orchestraitor-provider-neuralwatt" }
orchestraitor-provider-meta = { path = "../orchestraitor-provider-meta" }
orchestraitor-worker = { path = "../orchestraitor-worker" }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = { workspace = true }
toml_edit = { workspace = true }
# url (MIT OR Apache-2.0): form-encoded query building for `orc github api`
# GET/DELETE `--field` pairs (the `gh api` query-parameter shape).
url = { workspace = true }

[dev-dependencies]
# chrono (MIT OR Apache-2.0): CostEntry timestamps in stats fixtures.
chrono = { version = "0.4", features = ["serde"] }
# rusqlite (MIT): asserting the persisted decision rows in the campaign.db.
rusqlite = { workspace = true }
orchestraitor-testkit = { path = "../orchestraitor-testkit" }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
