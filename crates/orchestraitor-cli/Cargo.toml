[package]
name = "orchestraitor-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command-line interface for Orchestraitor"

[[bin]]
name = "orc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
miette = { workspace = true }
orchestraitor-agent-catalog = { path = "../orchestraitor-agent-catalog" }
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-model = { path = "../orchestraitor-model" }
orchestraitor-provider-meta = { path = "../orchestraitor-provider-meta" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
