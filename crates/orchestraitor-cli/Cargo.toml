[package]
name = "orchestraitor-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command-line interface for Orchestraitor"

[[bin]]
name = "orc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
miette = { workspace = true }
orchestraitor-agent-catalog = { path = "../orchestraitor-agent-catalog" }
orchestraitor-board = { path = "../orchestraitor-board" }
orchestraitor-campaign = { path = "../orchestraitor-campaign" }
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-model = { path = "../orchestraitor-model" }
orchestraitor-provider-meta = { path = "../orchestraitor-provider-meta" }
orchestraitor-worker = { path = "../orchestraitor-worker" }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
# rusqlite (MIT): asserting the persisted decision rows in the campaign.db.
rusqlite = { workspace = true }
orchestraitor-testkit = { path = "../orchestraitor-testkit" }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
