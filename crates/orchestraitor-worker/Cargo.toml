[package]
name = "orchestraitor-worker"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless one-shot bootstrap mini-worker with the four-tool mediated minimal set (spec 10-orchestrator.md §9.38, 60-milestones.md MVP-6)"

[lints]
workspace = true

[dependencies]
# async-trait (MIT OR Apache-2.0): object-safe async traits for the
# ProviderTransport-facing seams (DeliverySink, BashMediator); matches the
# sibling provider crates (orchestraitor-provider-api, -neuralwatt).
async-trait = "0.1"
orchestraitor-arbitraitor-client = { path = "../orchestraitor-arb-client" }
chrono = { version = "0.4", features = ["serde"] }
orchestraitor-cost-ledger = { path = "../orchestraitor-cost-ledger" }
# orchestraitor-core (MIT OR Apache-2.0): the shared §9.23.4 secret-shape
# heuristic the `think` tool's fail-closed refusal scans with — one
# implementation, shared with `decision.record` validation (§9.48.4).
orchestraitor-core = { path = "../orchestraitor-core" }
# orchestraitor-events (MIT OR Apache-2.0): the ReasoningEvent trait the
# shared §9.48.8 appender consumes — one event implementation, two callers
# (daemon and foreground loop) with no duplicated payload code.
orchestraitor-events = { path = "../orchestraitor-events" }
orchestraitor-model = { path = "../orchestraitor-model" }
orchestraitor-provider-api = { path = "../orchestraitor-provider-api" }
orchestraitor-provider-neuralwatt = { path = "../orchestraitor-provider-neuralwatt" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
orchestraitor-testkit = { path = "../orchestraitor-testkit" }
# orchestraitor-mcp (MIT OR Apache-2.0), TESTS ONLY: the delivery tests assert
# that a body the lane composes passes the ENGINE's own `parse_checklist`
# (`unparseable == false`) — the real invariant, instead of a list of
# constructs the test would have to keep in step by hand
# (arbsec/orchestraitor#799 R14). Production code deliberately does NOT depend
# on the MCP gateway; it reads the shared grammar in orchestraitor-core.
orchestraitor-mcp = { path = "../orchestraitor-mcp" }
secrecy = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
