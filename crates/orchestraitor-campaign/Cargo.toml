[package]
name = "orchestraitor-campaign"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "One-shot campaign pass: reads the reconciled board, selects at most one eligible task, and persists exactly one append-only decision record (spec 10-orchestrator.md §9.35, issue #313)"

[lints]
workspace = true

[dependencies]
# async-trait (MIT OR Apache-2.0): object-safe async seams for the loop
# runner (BoardPoller, LoopWorkerStarter); matches the board and
# provider-api crates.
async-trait = "0.1"
# rusqlite (MIT): append-only SQLite decision-store, mirroring the
# agent-catalog RoleRoutingDecisionStore pattern (schema_migrations-versioned).
rusqlite = { workspace = true }
# tokio (MIT): the loop runner's supervision primitives — watch channels
# (progress beats), task spawn/abort (the kill primitive), time (tick
# cadence and virtual-clock tests), and select (shutdown racing).
tokio = { workspace = true }
# provider-api (MIT OR Apache-2.0): the §9.45 DecisionProvider trait — the
# campaign consults a configured decision provider for task selection via a
# blanket adapter; the deterministic selector stays the fallback.
orchestraitor-provider-api = { path = "../orchestraitor-provider-api" }
orchestraitor-agent-catalog = { path = "../orchestraitor-agent-catalog" }
orchestraitor-board = { path = "../orchestraitor-board" }
orchestraitor-worker = { path = "../orchestraitor-worker" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# tokio/test-util (MIT): `tokio::time::advance` — the virtual-clock control
# the issue's no-real-sleeps test requirement is built on.
tokio = { workspace = true, features = ["test-util"] }
