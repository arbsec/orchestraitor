[package]
name = "orchestraitor-provider-neuralwatt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Neuralwatt GLM-5.2 BYOK provider adapter for Orchestraitor (spec §10.3)"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-cost-ledger = { path = "../orchestraitor-cost-ledger" }
orchestraitor-events = { path = "../orchestraitor-events" }
orchestraitor-model = { path = "../orchestraitor-model" }
orchestraitor-provider-api = { path = "../orchestraitor-provider-api" }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
tokio = { workspace = true }
