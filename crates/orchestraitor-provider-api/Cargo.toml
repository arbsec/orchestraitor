[package]
name = "orchestraitor-provider-api"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Provider transport traits, auth resolution, and redacted tracing for Orchestraitor"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-model = { path = "../orchestraitor-model" }
# reqwest (MIT OR Apache-2.0): the System One decision client's single-shot
# HTTP surface (spec `30-model-routing.md` §9.45) — the same workspace-pinned
# transport stack the provider adapters use; no new dependency.
reqwest = { workspace = true }
secrecy = { workspace = true }
url = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
