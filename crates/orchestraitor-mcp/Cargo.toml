[lints]
workspace = true

[dependencies]
orchestraitor-arbitraitor-client = { path = "../orchestraitor-arb-client" }
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-events = { path = "../orchestraitor-events" }
orchestraitor-model = { path = "../orchestraitor-model" }
hex = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
