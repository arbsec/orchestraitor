[package]
name = "orchestraitor-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "rmcp gateway, built-in tools, and canonical MCP configuration for Orchestraitor"

[lints]
workspace = true

[dependencies]
# orchestraitor-board-contract (MIT OR Apache-2.0): the BoardProvider surface
# `board.query` reads through (spec §9.43; issue #332) — the tool is a typed
# reader over the contract, never a second board implementation.
orchestraitor-board-contract = { path = "../orchestraitor-board-contract" }
# orchestraitor-events (MIT OR Apache-2.0): the §9.25.1 audit recording of
# every `board.query` invocation (spec §9.39; issue #332) — the existing
# event store, not a new mechanism.
orchestraitor-events = { path = "../orchestraitor-events" }
# orchestraitor-model (MIT OR Apache-2.0): OperationId for delegation-chain
# correlation ids on recorded events.
orchestraitor-model = { path = "../orchestraitor-model" }
# time (MIT OR Apache-2.0): RFC 3339 wall-clock stamps on recorded events,
# matching the event schema's timestamp convention.
time = { workspace = true }
orchestraitor-arbitraitor-client = { path = "../orchestraitor-arb-client" }
orchestraitor-core = { path = "../orchestraitor-core" }
hex = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# async-trait (MIT OR Apache-2.0): the test FailingProvider implements the
# object-safe BoardProvider trait.
async-trait = "0.1"
# tokio (MIT OR Apache-2.0): async test runtime for `board.query` tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
