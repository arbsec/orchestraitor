[package]
name = "orchestraitor-agent-catalog"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Domain and role catalog, model route resolver, and detection heuristics for Orchestraitor"

[lints]
workspace = true

[dependencies]
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-model = { path = "../orchestraitor-model" }
# Decision-record persistence for spec 30-model-routing.md §9.45 uses the
# workspace-pinned SQLite crate (tech-stack §11); no new third-party dependency.
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
