[package]
name = "orchestraitor-events"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Normalized event schema and tamper-evident audit store for Orchestraitor"

[lints]
workspace = true

[dependencies]
hex = { workspace = true }
orchestraitor-core = { path = "../orchestraitor-core" }
orchestraitor-model = { path = "../orchestraitor-model" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# rusqlite (MIT): SQLite-backed §9.17 audit persistence, mirroring the
# append-only in-memory store with tamper-evident re-validation on read.
rusqlite = { workspace = true }

[dev-dependencies]
# rusqlite hooks (MIT): the authorizer callback drives the append/import
# interleaving test.
rusqlite = { workspace = true, features = ["hooks"] }
# tempfile (MIT/Apache-2.0): hermetic file-backed store tests.
tempfile = { workspace = true }
