[package]
name = "orchestraitor-board-contract"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "BoardProvider contract and write-through read-cache semantics (spec 10-orchestrator.md §9.43, issue #318)"

[lints]
workspace = true

[dependencies]
# async-trait (MIT OR Apache-2.0): object-safe async trait for BoardProvider,
# matching the BoardAuth / ProviderTransport convention in sibling crates.
async-trait = "0.1"
# serde (MIT OR Apache-2.0): typed serialization of contract data and the
# `board-diverged` event so the sqlite follow-up provider can persist them.
serde = { workspace = true, features = ["derive"] }
# thiserror (MIT OR Apache-2.0): typed errors at the library boundary
# (tech-stack.md §12).
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# serde_json (MIT OR Apache-2.0): asserts the `board-diverged` event's
# serialized shape in tests only.
serde_json = { workspace = true }
