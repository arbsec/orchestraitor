[workspace]
resolver = "3"
# Members are listed explicitly (not implicit via path dependencies) so that
# `cargo --workspace` commands cover every crate regardless of the dependency
# graph (regression fix for arbsec/orchestraitor#250).
members = [
    "crates/orchestraitor-adapter-api",
    "crates/orchestraitor-adapter-host",
    "crates/orchestraitor-agent-catalog",
    "crates/orchestraitor-arb-client",
    "crates/orchestraitor-board",
    "crates/orchestraitor-board-contract",
    "crates/orchestraitor-campaign",
    "crates/orchestraitor-cli",
    "crates/orchestraitor-context",
    "crates/orchestraitor-core",
    "crates/orchestraitor-cost-ledger",
    "crates/orchestraitor-daemon",
    "crates/orchestraitor-delivery",
    "crates/orchestraitor-events",
    "crates/orchestraitor-lifecycle",
    "crates/orchestraitor-mcp",
    "crates/orchestraitor-model",
    "crates/orchestraitor-provider-api",
    "crates/orchestraitor-provider-meta",
    "crates/orchestraitor-provider-neuralwatt",
    "crates/orchestraitor-provider-proxy",
    "crates/orchestraitor-simplify",
    "crates/orchestraitor-tui",
    "crates/orchestraitor-testkit",
    "crates/orchestraitor-worker",
    "crates/orchestraitor-workspace",
    "crates/orchestraitor-workspace-hack",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arbsec/orchestraitor"
homepage = "https://github.com/arbsec/orchestraitor"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
multiple_crate_versions = "allow"

[workspace.dependencies]
# Arbitraitor crates — pinned to commit 1b269e06 (2026-10-13 main HEAD).
# Update weekly; CI "Arbitraitor bump" job catches API drift.
# When Arbitraitor publishes a semver tag, switch to tag = "v0.x.y".
arbitraitor-core       = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }
arbitraitor-model      = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }
arbitraitor-policy     = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }
arbitraitor-sandbox    = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }
arbitraitor-exec       = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }
arbitraitor-receipt    = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }
arbitraitor-mcp        = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }
arbitraitor-plugin-api = { git = "https://github.com/arbsec/arbitraitor.git", rev = "982517f3e3a0a607d35ef2a717c170cd9368485b" }

# Core async + serialization (tech-stack.md §1)
tokio = { version = "1.52", features = ["rt", "macros", "sync", "time", "net", "process", "io-util", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
bytes = "1.11"

# Error handling and diagnostics (tech-stack.md §12)
thiserror = "2"
miette = { version = "7.6", features = ["fancy"] }

# Logging / telemetry (tech-stack.md §1)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "registry"] }

# CLI (tech-stack.md §1)
clap = { version = "4.6.4", features = ["derive", "env", "string", "wrap_help"] }

# Cryptography and identity (tech-stack.md §1, §8). ed25519-dalek (independent
# receipt verification) is added by the feature that first verifies receipts, at
# the release it exercises — not declared here; the ownership question is #737.
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.23", features = ["v4", "serde"] }
# RS256 JWT signing for the GitHub App service identity (issue #307); MIT license;
# aws_lc_rs backend reuses the workspace-pinned aws-lc-rs (tech-stack.md §5.2).
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
# RFC 3339 `expires_at` parsing for minted GitHub installation tokens (issue #307).
time = { version = "0.3.54", default-features = false, features = ["parsing", "std"] }

# Receipt canonicalization (tech-stack.md §1)
serde_json_canonicalizer = "0.4.0"

# Secrets (tech-stack.md §1, §3.2)
secrecy = "0.10.3"
zeroize = { version = "1.9.0", features = ["derive"] }
keyring = "4.1.5"

# HTTP and networking (tech-stack.md §1, §5)
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "blocking"] }
url = "2.5"

# Server / proxy (tech-stack.md §1)
hyper = { version = "1.11", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
tower = "0.5"

# TLS (tech-stack.md §1, §5.2)
rustls = "0.23.42"
aws-lc-rs = "1.17.3"

# Configuration (tech-stack.md §1, §13)
toml = "1.1.3"
toml_edit = "0.25"
figment = { version = "0.10.19", features = ["toml", "env", "json"] }

# Storage (tech-stack.md §1, §11)
rusqlite = { version = "0.41", features = ["bundled"] }

# Concurrency primitives (short critical sections; guard-returning locks
# remove poisoning boilerplate at call sites)
parking_lot = "0.13.0"

# Git (tech-stack.md §1, §6)
gix = { version = "0.90.0", default-features = false, features = ["sha1", "worktree-mutation", "status", "attributes", "excludes", "mailmap", "blob-diff"] }

# Tree-sitter (tech-stack.md §1, §9.1)
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"

# MCP (tech-stack.md §1, §4). ACP crates (agent-client-protocol*) are added by the
# feature that first consumes them — M4 IDE integration — not declared here (#726).
rmcp = { version = "3.5.1", features = ["server", "client", "macros", "schemars", "auth", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }

# PTY (tech-stack.md §1). portable-pty is added by the wrapped-harness PTY
# adapter (post-MVP; 20-harness-worker.md §10.1 priority 5), not declared here (#736).

# Sandbox (tech-stack.md §1, §7). Landlock backends are Arbitraitor's
# (arbitraitor-sandbox), so no `landlock` requirement is declared here (#736).
# `nix` is declared but consumed by no member and resolves transitively at a
# different version; not part of this cleanup and left unchanged.
nix = "0.31.3"

# TUI (tech-stack.md §1). ratatui-image (optional inline images) is added by the
# PR that adds the image feature — no such feature exists yet (#736).
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }

# JSON-RPC (tech-stack.md §1)
jsonrpsee = { version = "0.26.0", features = ["server", "macros"] }

# Schemas — MUST match Arbitraitor's version (tech-stack.md §1, §2.1)
schemars = { version = "1.0", features = ["uuid1", "url2"] }

# Provider transport and LSP wire types (tech-stack.md §1, §4.4, §9.2). `genai`
# and `lsp-types` are added by the features that first consume them — the
# transport that adopts genai, and the wrapped-harness LSP client — at the
# release each exercises; no crate calls either today (#736).

# Filesystem (tech-stack.md §1)
cap-std = "4.0"
cap-tempfile = "4.0"
tempfile = "3"

# OS (tech-stack.md §1, §7)
rustix = { version = "1.1.4", features = ["fs", "process"] }

# Testing (tech-stack.md §1). proptest (§21.2.2 property tests) and insta
# (§21.2.5 snapshot tests) are added by the first test that uses them; no member
# consumes either today (#736).

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = 1
strip = "none"

[profile.test]
debug = 1
