[global]
disable = [
    "MD013",
    "MD033",
    "MD041",
    "MD024",
    "MD025",
    "MD040",
]
exclude = [
    "docs/spec/**",
    ".agents/**",
    "target/**",
    ".rumdl_cache/**",
]

[MD003]
style = "atx"

[MD026]
punctuation = ",;:!"

[MD007]
indent = 2

[MD012]
maximum = 1

[per-file-ignores]
# Workflow YAML: comment blocks are markdown to rumdl's parser, and action
# pins use aligned double spaces (same pattern the existing workflows carry).
".github/workflows/*.yml" = ["MD022", "MD023", "MD026", "MD034", "MD064"]
