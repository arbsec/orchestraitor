name: Bug
description: Report unexpected or incorrect Orchestraitor behavior
title: "fix: <short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use [private vulnerability
        reporting](https://github.com/arbsec/orchestraitor/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and inputs to reproduce the behavior.
      placeholder: |
        1. Run `orc ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: spec-ref
    attributes:
      label: Specification reference
      description: "Which `docs/spec/spec.md` §N does this behavior relate to? Required for triage."
      placeholder: "spec.md §9.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orchestraitor version / commit
      placeholder: "commit SHA or `orc version` output once it exists"
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redact all secrets, credentials, tokens, and signed URLs (spec §9.23.4).
