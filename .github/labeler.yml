# .github/labeler.yml — SAFETY NET for PR labels. The in-script labeling
# chain (`pr-labels` + `pr-labels-from-issue`, run by `pr-create` at create
# time) stays AUTHORITATIVE for attribution (`agent-created`) and
# `needs-human-review` routing; this file only backfills process labels when
# the chain does not fire (e.g. Renovate PRs, chain subcommand unavailable).
# Derived from the policy in
# .agents/project/orchestraitor-workflow.md "PR labeling and human attention"
# and .agents/skills/github-pr-lifecycle/scripts/pr-labels-from-issue.
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['Cargo.toml', 'Cargo.lock']
  - title:
      - regex: '^chore\(deps(-dev)?\)(\([^)]+\))?!?: '
spec:
  - changed-files:
      - any-glob-to-any-file: ['docs/spec/**']
  - title:
      - regex: '^docs\(spec\)(\([^)]+\))?!?: '
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**', 'README.md', 'CHANGELOG.md', 'AGENTS.md', '.github/ISSUE_TEMPLATE/**', 'docs/adr/**']
  - title:
      - regex: '^docs(\([^)]+\))?!?: '
github-actions:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**', '.github/actions/**']
test:
  - changed-files:
      - any-glob-to-any-file: ['**/tests/**', '**/*_test.rs', '**/test_*.rs', '**/conformance/**']
task:
  - title:
      - regex: '^(feat|fix|chore|perf|refactor|test|ci|build)\('
