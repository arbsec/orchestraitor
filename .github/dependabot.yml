version: 2

# Keep GitHub Actions pinned to SHAs in the workflows themselves; Dependabot
# only proposes the bumps — a maintainer reviews each one (see AGENTS.md).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # Cargo updates are advisory during the pre-implementation phase. The workspace
  # does not exist yet; these PRs become actionable once Cargo.toml lands.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - cargo
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor
