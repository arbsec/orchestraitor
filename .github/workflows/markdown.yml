name: Markdown

on:
  push:
    branches: [main]
    paths: &md_paths
      # `xtask docs-check` scans EVERY `.md`, `.rs`, `.yml`/`.yaml` and `.toml`
      # file in the tree for legacy section references, so the trigger covers the
      # scanned file types, not only markdown: a markdown-only filter leaves
      # Rust-comment and TOML drift unchecked in a PR that touches no `.md`
      # (arbsec/orchestraitor#741). The recursive (`**/`) and the root-level
      # (`*`) forms are both listed so a root-level file matches either way.
      - "**/*.md"
      - "**/*.rs"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "*.md"
      - "*.rs"
      - "*.yml"
      - "*.yaml"
      - "*.toml"
      # Dotfiles are named explicitly rather than relying on `*` matching a
      # leading dot: `rumdl.toml` is the lint config, and `.mise.toml` pins the
      # tool version, so a change to either must re-run the lint job.
      - ".mise.toml"
      - "rumdl.toml"
      - "lefthook.yml"
      - ".github/workflows/markdown.yml"
  pull_request:
    paths: *md_paths

permissions:
  contents: read

concurrency:
  group: markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `persist-credentials: false`: no step in this job pushes commits or calls an
      # authenticated API, so the checkout token has no consumer (zizmor `artipacked`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # `rumdl` comes from `.mise.toml`, the repository's single source of
      # truth for tool versions, where it is pinned to an exact version. A
      # floating tag (`latest`) let the rule set change without a repository
      # change: the local pre-PR gate and this job then ran different `rumdl`
      # versions on the same tree and disagreed (arbsec/orchestraitor#761,
      # #762). `install_args: rumdl` installs only the linter — the Rust
      # toolchain this job does not need is left to the `docs-check` job.
      # The version the job actually got is asserted against the pin before
      # the lint runs, so a runner-image or registry change cannot silently
      # shift the gate.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          install_args: rumdl
      - name: Lint markdown
        run: |
          pinned="$(sed -n 's/^rumdl = "\(.*\)"$/\1/p' .mise.toml)"
          if [ -z "$pinned" ]; then
            echo "error: no rumdl pin in .mise.toml — the markdown gate needs one" >&2
            exit 1
          fi
          installed="$(rumdl --version | sed -n 's/^rumdl //p')"
          if [ "$installed" != "$pinned" ]; then
            echo "error: rumdl $installed is not the pinned $pinned (.mise.toml)" >&2
            exit 1
          fi
          printf 'rumdl %s (pinned)\n' "$installed"
          rumdl check .

  docs-check:
    name: Docs Consistency
    runs-on: ubuntu-latest
    # The job builds `xtask` (the toolchain comes from `.mise.toml` via
    # mise-action, so a cold runner installs Rust first); 5 minutes was the
    # stub-era value, when the job only echoed a string.
    timeout-minutes: 15
    steps:
      # `persist-credentials: false`: no step in this job pushes commits or calls an
      # authenticated API, so the checkout token has no consumer (zizmor `artipacked`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Rust comes from `.mise.toml` (1.98.1, matching `rust-toolchain.toml`),
      # the same setup code.yml uses for `cargo fmt`/`clippy`/`check`.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
      # `--locked`: CI must never rewrite the committed lockfile. A non-zero
      # exit fails the job — no `continue-on-error`, no `|| true`.
      - name: Docs consistency check
        run: cargo run --locked -p xtask -- docs-check
