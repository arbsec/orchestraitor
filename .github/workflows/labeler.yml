# Safety net for PR process labels (see .github/labeler.yml). The in-script
# labeling chain (pr-labels + pr-labels-from-issue via pr-create) stays
# authoritative for attribution and needs-human-review routing.
name: labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
