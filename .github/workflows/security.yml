name: Security

on:
  push:
    branches: [main]
    paths: &security_paths
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".mise.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths: *security_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  cargo-audit:
    name: Advisory Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        # Same ignores as arbitraitor's own security.yml at the pinned rev:
        # the advisories ride the yara-x transitive wasmtime/bincode graph
        # that arbitraitor ab7af5e introduces.
        run: cargo audit --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2026-0222 --ignore RUSTSEC-2026-0269 --ignore RUSTSEC-2026-0316 --ignore RUSTSEC-2026-0327
