name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# Qlty Cloud coverage ingestion (qlty.sh). No coverage thresholds are enforced here:
# per `.agents/project/orchestraitor-workflow.md` ("Qlty and coverage expectations") the
# intended enforced targets (Arbitraitor integration boundary + transaction/normalization
# engine, parity gate in docs/spec/tech-stack.md §15) are wired up later.
#
# Secret setup (owner, one-time): create a coverage token at
# https://qlty.sh → repo settings for arbsec/orchestraitor → Coverage, then add it as the
# repository secret `QLTY_COVERAGE_TOKEN`. Until the secret exists — and on fork PRs, which
# never receive repository secrets — this workflow runs the tests and uploads `lcov.info`
# as a workflow artifact but skips the qlty publish step, and still succeeds.

jobs:
  coverage:
    name: Coverage (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # llvm-cov instrumentation poisons sccache's cache with instrumented objects, so this
      # job must never write into the shared sccache cache used by code.yml. The variables
      # are set explicitly (empty) in case the runner image exports them by default.
      SCCACHE_GHA_ENABLED: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Installs cargo-llvm-cov and cargo-nextest. cargo-llvm-cov auto-installs the
      # `llvm-tools-preview` rustup component for the active toolchain in CI
      # (CI is detected via the `CI` env var, so no interactive prompt).
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172  # v2.87.20
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # cargo-llvm-cov nextest: run the workspace test suite under nextest (the same runner
      # as code.yml) and emit per-file LCOV for qlty. The nextest integration is the
      # dedicated `nextest` subcommand (not a --cargo-nextest flag).
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lcov.info
          path: lcov.info
          retention-days: 30
      # Publish to Qlty Cloud. Skipped when QLTY_COVERAGE_TOKEN is unset (not yet
      # configured, or a fork PR — fork PRs do not receive repository secrets), so the
      # job never fails because a secret is missing. QLTY_KNOWN_INITIAL_BRANCHES marks
      # the default branch as trusted so qlty ingests main pushes without prior history.
      - name: Publish coverage to qlty.sh
        if: env.QLTY_COVERAGE_TOKEN != ''
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5  # v2.4.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: lcov.info
          format: lcov
        env:
          QLTY_KNOWN_INITIAL_BRANCHES: main
      - name: Notice publish skipped
        if: env.QLTY_COVERAGE_TOKEN == ''
        run: echo "::notice::QLTY_COVERAGE_TOKEN not set (or fork PR); qlty coverage publish skipped. lcov.info is available as a workflow artifact."
