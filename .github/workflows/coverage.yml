name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# Qlty Cloud coverage ingestion (qlty.sh). No coverage thresholds are enforced here:
# per `.agents/project/orchestraitor-workflow.md` ("Qlty and coverage expectations") the
# intended enforced targets (Arbitraitor integration boundary + transaction/normalization
# engine, parity gate in docs/spec/tech-stack.md §15) are wired up later.
#
# Secret setup (owner, one-time): create a coverage token at
# https://qlty.sh → repo settings for arbsec/orchestraitor → Coverage, then add it as the
# repository secret `QLTY_COVERAGE_TOKEN`. Until the secret exists — and on fork PRs, which
# never receive repository secrets — this workflow runs the tests and uploads `lcov.info`
# as a workflow artifact but skips the qlty publish step, and still succeeds.

jobs:
  coverage:
    name: Coverage (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # llvm-cov instrumentation poisons sccache's cache with instrumented objects, so this
      # job must never write into the shared sccache cache used by code.yml. The variables
      # are set explicitly (empty) in case the runner image exports them by default.
      SCCACHE_GHA_ENABLED: ""
      RUSTC_WRAPPER: ""
    steps:
      # `persist-credentials: false`: nothing in this job needs the checkout-scoped
      # credentials (the qlty publish token arrives via the action's `token:` input), so
      # the runner's auth token is not persisted into the local git config for the
      # instrumented test run to inherit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Token-presence probe: a step `if:` cannot read `secrets` directly (the `env`
      # context in an `if:` only sees workflow/job `env:` blocks and step outputs), and a
      # job-level `env: QLTY_COVERAGE_TOKEN: ${{ secrets... }}` mapping would expose the
      # raw token to every step in the job. So the secret never enters a step environment:
      # this probe publishes only a boolean output, and the publish step receives the token
      # exclusively via the action's `token:` input. Fork PRs and unconfigured repos see
      # `has-token=false`, keeping the publish step skipped.
      - name: Check for coverage token
        id: has-token
        run: echo "has-token=${{ secrets.QLTY_COVERAGE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # Installs cargo-llvm-cov and cargo-nextest. cargo-llvm-cov auto-installs the
      # `llvm-tools-preview` rustup component for the active toolchain in CI
      # (CI is detected via the `CI` env var, so no interactive prompt).
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # cargo-llvm-cov nextest: run the workspace test suite under nextest (the same runner
      # as code.yml) and emit per-file LCOV for qlty. The nextest integration is the
      # dedicated `nextest` subcommand (not a --cargo-nextest flag).
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lcov.info
          path: lcov.info
          retention-days: 30
      # Publish to Qlty Cloud via the qlty-action, gated on the probe output. Skipped when
      # QLTY_COVERAGE_TOKEN is unset (not yet configured, or a fork PR — fork PRs do not
      # receive repository secrets), so the job never fails because a secret is missing.
      # `skip-errors: false` is explicit: the pinned action defaults it to true, which
      # would log upload failures while the job stays green; only the missing-token path
      # (the step-level if above) keeps the job green. There is no initial-branch or
      # first-upload flag to pass: qlty decides trust per branch from the uploads it
      # receives, and publishing to `main` works as soon as this step runs there with the
      # token set.
      - name: Publish coverage to qlty.sh
        if: steps.has-token.outputs.has-token == 'true'
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5  # v2.4.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: lcov.info
          format: lcov
          skip-errors: false
      - name: Notice publish skipped
        if: steps.has-token.outputs.has-token != 'true'
        run: echo "::notice::QLTY_COVERAGE_TOKEN not set (or fork PR); qlty coverage publish skipped. lcov.info is available as a workflow artifact."
