[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# RUSTSEC-2025-0141: bincode is unmaintained. Transitive via yara-x, which
# enters the graph through arbitraitor-analysis at the pinned rev df66f2d4; same
# ignore arbitraitor itself carries at that revision.
#
# RUSTSEC-2026-0370/0371/0372: the zbus 5 wire-format crates (`zvariant`,
# `zbus_names`, `zvariant_derive`) are unmaintained with no patched release —
# upstream merged them into zbus 6. zbus 5 is held by `secret-service` 5.2.0
# (latest) through `zbus-secret-service-keyring-store` 1.0.1 (latest) and
# `keyring` 4.2.0, which backs `secret://keyring/...` secret resolution. These
# are informational unmaintained advisories, not vulnerabilities.
#
# Keep this list in sync with the `cargo audit --ignore` set in
# .github/workflows/security.yml.
ignore = [
    "RUSTSEC-2025-0141",
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.0 is unmaintained and merged into zbus 6; no patched release exists. Held at zbus 5 by secret-service 5.2.0 (latest) via zbus-secret-service-keyring-store 1.0.1 (latest), which backs secret://keyring/... resolution. Informational only. Drop when that keyring store supports zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.4 is unmaintained and merged into zbus 6; no patched release exists. Held at zbus 5 by secret-service 5.2.0 (latest) via zbus-secret-service-keyring-store 1.0.1 (latest), which backs secret://keyring/... resolution. Informational only. Drop when that keyring store supports zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.x is unmaintained and merged into zbus 6; no patched release exists. Held at zbus 5 by secret-service 5.2.0 (latest) via zbus-secret-service-keyring-store 1.0.1 (latest), which backs secret://keyring/... resolution. Informational only. Drop when that keyring store supports zbus 6." },
]

[licenses]
version = 2
# Per tech-stack.md §18 and AGENTS.md: only MIT, Apache-2.0, BSD-3-Clause,
# ISC, and Apache-2.0 WITH LLVM-exception are approved. Transitive deps with
# other licenses are denied. Add per-crate exceptions here ONLY with justification.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/arbsec/arbitraitor.git"]
